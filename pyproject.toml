[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyline-transients"
version = "0.1.0"
description = "Rank time-sensitive astronomical alerts for scarce telescope follow-up."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
jax = ["jax>=0.4.28"]
dev = ["pytest>=8"]

[project.scripts]
skyline = "skyline.pipeline:main"
skyline-train = "skyline.jax_training:train_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
